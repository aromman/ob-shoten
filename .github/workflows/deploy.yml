name: Deploy ob-shoten

on:
  push:
    branches: [main]
  workflow_dispatch:

jobs:
  deploy:
    runs-on: ubuntu-latest
    environment: production
    concurrency:
      group: deploy-ob-shoten
      cancel-in-progress: false
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Lint PHP syntax
        run: |
          find . -name '*.php' -print0 | xargs -0 -n1 php -l

      # Página "Próximamente" en la raíz del dominio. Al lanzar el sitio se
      # quita este paso y el de OB pasa a desplegar en la raíz.
      - name: Deploy "Próximamente" via FTPS
        uses: SamKirkland/FTP-Deploy-Action@v4.4.0
        with:
          server: ${{ secrets.FTP_HOST }}
          username: ${{ secrets.FTP_USERNAME }}
          password: ${{ secrets.FTP_PASSWORD }}
          local-dir: ./proximamente/
          server-dir: ${{ vars.FTP_ROOT_DIR || '/public_html/' }}
          protocol: ftps
          dangerous-clean-slate: false
          exclude: |
            config.example.php

      - name: Deploy OB via FTPS
        uses: SamKirkland/FTP-Deploy-Action@v4.4.0
        with:
          server: ${{ secrets.FTP_HOST }}
          username: ${{ secrets.FTP_USERNAME }}
          password: ${{ secrets.FTP_PASSWORD }}
          server-dir: ${{ vars.FTP_REMOTE_DIR || '/public_html/ob-shoten/' }}
          protocol: ftps
          dangerous-clean-slate: false
          exclude: |
            **/.git*
            **/.git*/**
            **/.github/**
            **/README.md
            proximamente/**
            db/**
            shoten-config/**
